name: Check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  upload-oss-check:
    name: upload-oss-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit OSS security headers
        run: python3 scripts/upload_oss.py --check
